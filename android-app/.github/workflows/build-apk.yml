name: Build Signed Rajdev AI Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Generate Release Keystore
        working-directory: ./android-app
        run: |
          mkdir -p app/keystore
          keytool -genkey -v -keystore app/keystore/rajdev-release.jks \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -alias rajdev_ai_key \
            -storepass rajdev_secure_store \
            -keypass rajdev_secure_key \
            -dname "CN=Rajdev AI, OU=Mobile Engineering, O=Rajdev Studio, L=Mumbai, S=MH, C=IN"

      - name: Build Debug and Signed Release APKs
        working-directory: ./android-app
        run: |
          gradle assembleDebug assembleRelease

      - name: Verify APK Integrity & Signatures
        working-directory: ./android-app
        run: |
          apksigner verify --verbose app/build/outputs/apk/release/app-release.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/release/app-release.apk

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rajdev-ai-apks
          path: |
            android-app/app/build/outputs/apk/debug/*.apk
            android-app/app/build/outputs/apk/release/*.apk
